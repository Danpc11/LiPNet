name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      clean:
        description: 'Rebuild every result from an empty results/ directory (about 30 minutes)'
        type: boolean
        default: false
jobs:
  # The environment of the release, every package at the version of requirements-lock.txt. The whole pipeline is run
  # (the fits are reused only if they carry the fingerprint of this table and this model code), then the tests, then
  # the check that numbers, figures and cached model tables are the ones their inputs give.
  locked:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -r requirements-lock.txt
      - run: bash run_all.sh
      - run: python -m pytest tests -q
        env: { PYTHONPATH: src }
      - run: python src/manifest.py check
        env: { PYTHONPATH: src }
      - run: python src/manifest.py compare docs/MANIFEST-release.json
        env: { PYTHONPATH: src }
  # The loosest environment the code claims to run on: an older Python and whatever versions requirements.txt resolves
  # to today. Tests only, on a clone where nothing has been run.
  latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -q
  # Everything from nothing: results/ emptied, every fit sampled again, the model campaigns behind the cached tables
  # recomputed. Runs on a version tag and on request; the manifest and the numeric results are kept as an artifact.
  clean:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.clean)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -r requirements-lock.txt
      - run: bash run_all.sh --clean
      - run: python -m pytest tests -q
        env: { PYTHONPATH: src }
      - run: python src/manifest.py check
        env: { PYTHONPATH: src }
      - run: python src/manifest.py compare docs/MANIFEST-release.json --strict
        env: { PYTHONPATH: src }
      - uses: actions/upload-artifact@v4
        with:
          name: clean-rebuild
          path: |
            results/MANIFEST.json
            results/*.json
            results/*.tsv
